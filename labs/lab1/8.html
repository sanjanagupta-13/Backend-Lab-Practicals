<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         var r1=parseInt(prompt("enter r1:"))
         var r2=parseInt(prompt("enter r2:"))
         for(i=r1;i<=r2;i++){
           let flag=0;
          for(j=2;j<i;j++){
            if(i%j==0){
              flag=1;
              break;
            }
          }
          if(flag==0){
            document.write(i+" ")
          }
         }
    </script>
</body>
</html>
