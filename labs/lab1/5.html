<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var r,rev=0
        var n=parseInt(prompt("enter n:"))
        let temp=n;
        while(temp!=0){
            r=temp%10;
            rev=rev*10+r;
            temp= temp/10;
        }
        if(n==rev){document.write("palindrom")}
        else{document.write("not palindrom")}
    </script>
</body>
</html>
