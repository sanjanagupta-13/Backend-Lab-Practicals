<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var r,digit=0,sum=0
        var n=parseInt(prompt("enter n:"))
        let temp=n;
        while(temp!=0){
            r=temp%10;
            digit++
            temp= parseInt(temp/10);
        }
        temp=n;
        while(temp!=0){
            r=temp%10;
            sum=sum+Math.pow(r,digit)
            temp= parseInt(temp/10);
        }
         document.write(""+sum);
        if(n==sum){document.write("armstrong")}
        else{document.write("not armstrong")}
    </script>
</body>
</html>
