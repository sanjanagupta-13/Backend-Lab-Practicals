<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let flag=0
        var n=parseInt(prompt("enter n:"))

        for(i=2;i<n;i++){
            if(n%i==0){
                flag++
            }
        }

        if(flag==0){
            document.write("prime number")
        }
        else{
            document.write("not prime number")
        }
    </script>
</body>
</html>
