<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
   var a=parseInt(prompt("enter a:"))
   var b=parseInt(prompt("enter b:"))
   var c=prompt("+,-,*,/,%,")
   switch(c){
    case '+': var sum=a+b
              alert(a+"+"+b+"="+sum)
              break
    case '-': var sum=a-b
              alert(a+"-"+b+"="+sum)
              break
    case '*': var sum=a*b
              alert(a+"*"+b+"="+sum)
              break
    case '/': var sum=a/b
              alert(a+"/"+b+"="+sum)
              break
   }

   </script> 
</body>
</html>
