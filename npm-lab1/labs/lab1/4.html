<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         var a=0;
         var b=1;
         var c=0;
        var n=parseInt(prompt("enter n:"))
        document.write(a+" "+b);
        for(i=1;i<=n;i++){
           c=a+b;
          document.write(" "+c);
           a=b
           b=c 
        }
  
    </script>
</body>
</html>
