<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n=5;
        for(i=1;i<=n;i++){
            for(k=n;k>=i;k--){
                document.write("&nbsp;")
            }
            for(j=1;j<=2*i-1;j++){
                 document.write("*")
            }
            document.write("<br>")
        }
    </script>
</body>
</html>
